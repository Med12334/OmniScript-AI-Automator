<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniScript | Telemetry Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: #0f172a; color: #f8fafc; padding: 2rem; }
        header { border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
        h1 { color: #38bdf8; font-size: 1.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
        .card h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem; text-transform: uppercase; }
        .stat { font-size: 2.5rem; font-weight: bold; color: #10b981; }
        canvas { max-width: 100%; height: 250px !important; }
    </style>
</head>
<body>

    <header>
        <h1>OmniScript Telemetry</h1>
        <p style="color: #94a3b8; margin-top: 0.5rem;">Live AI Execution Metrics</p>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Total Automated Actions</h3>
            <div class="stat" id="total-actions">14,208</div>
        </div>
        <div class="card">
            <h3>Avg. AI Response Latency</h3>
            <div class="stat" style="color: #f59e0b;">842ms</div>
        </div>
        <div class="card">
            <h3>Success Rate</h3>
            <div class="stat" style="color: #3b82f6;">98.4%</div>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
            <h3>Execution Success vs. Failure (Last 7 Days)</h3>
            <canvas id="performanceChart"></canvas>
        </div>
    </div>

    <script>
        // Simulating data fetched from your Python PostgreSQL Database
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [
                    {
                        label: 'Successful Actions',
                        data: [1200, 1900, 1500, 2200, 1800, 2800, 2600],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    },
                    {
                        label: 'Failed Parsings',
                        data: [45, 30, 80, 20, 40, 15, 25],
                        borderColor: '#ef4444',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#f8fafc' } } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    </script>
</body>
</html>
